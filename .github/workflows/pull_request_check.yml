name: Pull Request Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# `actions: read` is what `nx-set-shas` needs on a push: with no pull request to
# take a base from, it asks the workflow-runs API for the last successful run on
# the branch. The repository's default token grants contents and packages only,
# so that call answered "Resource not accessible by integration" and failed every
# push to `main` while pull requests passed. Spelled out rather than left to the
# default, because naming a block at all turns every scope not listed into `none`.
permissions:
  contents: read
  actions: read

# entifix's pull-request check, sized for one app, one e2e project and one tool:
# no matrix chunking, the same install-once cache, affected scoping and gate.
jobs:
  # Installs once and saves the result, so every job below restores
  # `node_modules` instead of spending its first half-minute on `pnpm install`.
  initialize:
    name: Initialize
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.shas.outputs.base }}
      head: ${{ steps.shas.outputs.head }}
      lint-projects: ${{ steps.projects.outputs.lint }}
      build-projects: ${{ steps.projects.outputs.build }}
      typecheck-projects: ${{ steps.projects.outputs.typecheck }}
      test-projects: ${{ steps.projects.outputs.test }}
      e2e-projects: ${{ steps.projects.outputs.e2e }}
      preview-projects: ${{ steps.projects.outputs.preview }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: '11.9'
      # ⚠️ No `cache: pnpm` here, unlike every other job's identical step. That
      # option makes setup-node save pnpm's store after the job, and the store
      # only exists when `pnpm install` ran — which the cache hit below skips.
      # On a hit the post step then fails the whole job on a path that was
      # never written, taking `CI Gate` with it. What is worth caching is
      # `node_modules`, and the step below already caches it.
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      # The key must change whenever what `pnpm install` would produce changes:
      # the lockfile, the workspace member globs, and the Node version native
      # modules were resolved for. Every job below spells the same key.
      #
      # The paths are the root `node_modules`, which holds pnpm's virtual store
      # in `.pnpm`, plus each workspace member's own `node_modules` of symlinks
      # into it. A restore without the member directories resolves nothing.
      - name: Restore dependencies
        id: deps
        uses: actions/cache/restore@v4
        with:
          key: deps-${{ runner.os }}-node26.4-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json') }}
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            tools/*/node_modules
      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      - name: Save dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.deps.outputs.cache-primary-key }}
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            tools/*/node_modules

      - name: Resolve affected base/head
        id: shas
        uses: nrwl/nx-set-shas@v4

      # A pull request runs what it affects; `main` runs everything.
      - name: Compute projects per target
        id: projects
        run: |
          # `tail -n1` is load-bearing: pnpm prints its warnings to STDOUT, so
          # anything it has to say lands in front of the JSON and `jq` dies on
          # it. nx prints the array as a single last line.
          # A step's default shell is `bash -e` without `pipefail`, so a failing
          # `nx show projects` piped into `tail` would report `tail`'s success.
          set -o pipefail
          projects() {
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              pnpm nx show projects --affected \
                --base=${{ steps.shas.outputs.base }} \
                --head=${{ steps.shas.outputs.head }} \
                --withTarget "$1" --json | tail -n1
            else
              pnpm nx show projects --withTarget "$1" --json | tail -n1
            fi
          }

          # Assigned before they are echoed, and that is load-bearing: a failure
          # inside `$(…)` in an `echo` argument does not stop the step, so a
          # project graph that fails to build would leave every list empty,
          # every job `skipped`, and the gate free to pass a run in which
          # nothing ran. An assignment's exit status is its substitution's.
          #
          # Both substitutions, not just the first: `tail -n1` takes whatever
          # nx printed last, so a notice that lands after the JSON reaches `jq`
          # instead of the array. Leaving that one inside the `echo` argument
          # reopened the hole this reasoning closes, on a step that still
          # exited 0.
          for target in lint build typecheck test e2e preview; do
            list=$(projects "$target")
            joined=$(jq -r 'join(",")' <<<"$list")
            echo "$target=$joined" >> "$GITHUB_OUTPUT"
          done

  lint:
    name: Lint
    needs: initialize
    if: needs.initialize.outputs.lint-projects != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: '11.9'
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      # A miss fails the job rather than falling back to an install. Initialize
      # saved this exact key moments ago, so a miss means the key expression
      # drifted between jobs, and a silent reinstall would hide that.
      - uses: actions/cache/restore@v4
        with:
          key: deps-${{ runner.os }}-node26.4-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json') }}
          fail-on-cache-miss: true
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            tools/*/node_modules
      - run: pnpm nx run-many -t lint --projects="${{ needs.initialize.outputs.lint-projects }}"

  # The static export is the build: a page reaching for `headers()`, `cookies()`
  # or a dynamic route handler fails `next build` here.
  build:
    name: Build & typecheck
    needs: initialize
    if: needs.initialize.outputs.build-projects != '' || needs.initialize.outputs.typecheck-projects != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: '11.9'
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - uses: actions/cache/restore@v4
        with:
          key: deps-${{ runner.os }}-node26.4-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json') }}
          fail-on-cache-miss: true
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            tools/*/node_modules
      - name: Build
        if: needs.initialize.outputs.build-projects != ''
        run: pnpm nx run-many -t build --projects="${{ needs.initialize.outputs.build-projects }}"
      # `always()` so a failed build does not hide a type error beside it. The
      # app's typecheck runs `next typegen` first, which needs no build.
      - name: Typecheck
        if: always() && needs.initialize.outputs.typecheck-projects != ''
        run: pnpm nx run-many -t typecheck --projects="${{ needs.initialize.outputs.typecheck-projects }}"

  test:
    name: Test
    needs: initialize
    if: needs.initialize.outputs.test-projects != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: '11.9'
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - uses: actions/cache/restore@v4
        with:
          key: deps-${{ runner.os }}-node26.4-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json') }}
          fail-on-cache-miss: true
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            tools/*/node_modules
      # Every project with logic collects coverage on each run and fails below
      # 100%; `--coverage` also covers any project that does not enable it.
      - run: pnpm nx run-many -t test --projects="${{ needs.initialize.outputs.test-projects }}" --coverage

  # Against the export served like a bucket (`tools/serve-static.mjs`), never
  # against a Next server. `e2e` depends on `myself-app:build`.
  e2e:
    name: E2E
    needs: initialize
    if: needs.initialize.outputs.e2e-projects != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: '11.9'
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - uses: actions/cache/restore@v4
        with:
          key: deps-${{ runner.os }}-node26.4-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json') }}
          fail-on-cache-miss: true
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            tools/*/node_modules
      - name: Resolve the Playwright version
        id: playwright
        run: |
          VERSION=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # ⚠️ Drop Google's Chrome apt repository before installing anything, as
      # r10c does. Both install steps below shell out to `apt-get update`, which
      # fails the whole job if *any* configured repository is inconsistent — and
      # the runner image ships `dl.google.com/linux/chrome-stable`, whose index
      # served a mismatched `Packages.gz` for over an hour on 2026-09-09.
      # Playwright downloads its own Chromium; apt only supplies shared
      # libraries, so this repository is a dependency the job never asked for.
      # Matched by content, not filename: the image also ships it as `*.sources`.
      - name: Drop apt sources this job does not need
        run: |
          sudo bash -euo pipefail -c '
            for file in $(grep -rl "dl\.google\.com" /etc/apt/sources.list.d 2>/dev/null || true); do
              echo "removing $file"
              rm -f "$file"
            done
            sed -i "/dl\.google\.com/d" /etc/apt/sources.list 2>/dev/null || true
          '
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm nx run-many -t e2e --projects="${{ needs.initialize.outputs.e2e-projects }}"
      # `e2e` depends on `myself-app:pdf`, so the CV PDFs are in the export by
      # now. Kept on every run, so a change is reviewed as the PDF it produces.
      - name: Keep the CV PDFs
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdfs
          path: apps/myself-app/out/**/*.pdf
          if-no-files-found: ignore
          retention-days: 14
      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/*-e2e/test-output
          retention-days: 7

  # `pulumi preview` against the real account, under the read-only role (ADR
  # 0013): the plan that merging would apply. Pull requests only — the role
  # trusts `pull_request` tokens and nothing else, and `main` applies instead
  # of previewing (`deploy.yml`). A fork's pull request gets no OIDC token and
  # fails here rather than skipping.
  infra-preview:
    name: Infrastructure preview
    needs: initialize
    if: github.event_name == 'pull_request' && needs.initialize.outputs.preview-projects != ''
    runs-on: ubuntu-latest
    # Naming a block turns every scope not listed into `none`, so the
    # workflow's own two are repeated beside the one this job adds.
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: '11.9'
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - uses: actions/cache/restore@v4
        with:
          key: deps-${{ runner.os }}-node26.4-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json') }}
          fail-on-cache-miss: true
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            tools/*/node_modules
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PREVIEW_ROLE_ARN }}
          aws-region: us-east-1
      # Installs the CLI only; the preview itself is the Nx target, as locally.
      - uses: pulumi/actions@v7
        with:
          pulumi-version: 3.264.0
      # `static`: the plan is the point of this job, and run-many otherwise
      # hides a successful task's output.
      - run: pnpm nx run-many -t preview --projects="${{ needs.initialize.outputs.preview-projects }}" --output-style=static
        env:
          PULUMI_SKIP_UPDATE_CHECK: 'true'

  # NOTE: this job must stay unconditional, and its commands must not become
  # affected-scoped. Formatting and the conventions are claims about the whole
  # repository, and the pull request that breaks one need not touch the project
  # that checks it.
  conventions:
    name: Formatting & conventions
    needs: initialize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: '11.9'
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - uses: actions/cache/restore@v4
        with:
          key: deps-${{ runner.os }}-node26.4-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json') }}
          fail-on-cache-miss: true
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            tools/*/node_modules
      # `always()` on every step, so one failure does not hide the next. The
      # job still fails if any step does.
      - name: Formatting
        if: always()
        run: pnpm exec prettier --check .
      - name: The repository conventions
        if: always()
        run: pnpm nx test @myself-app/conventions

  # A commit that slips past `.husky/commit-msg` — with `--no-verify`, from a
  # clone where `pnpm install` never ran, or through the GitHub web editor — is
  # caught here instead.
  commits:
    name: Commit conventions
    needs: initialize
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: '11.9'
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - uses: actions/cache/restore@v4
        with:
          key: deps-${{ runner.os }}-node26.4-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json') }}
          fail-on-cache-miss: true
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            tools/*/node_modules

      - name: Every commit in the range
        if: always()
        run: |
          pnpm exec commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose

      # Under a squash merge the pull request title becomes the commit message
      # on `main`. Linting the commits without the title would check something
      # that never lands.
      - name: The pull request title
        if: always()
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint --verbose

      # The one surface no git hook can see. Body and SHAs arrive through the
      # environment, never interpolated into the script: a body is arbitrary
      # text, and a backtick or `$(` in it would otherwise run.
      - name: The pull request body and its commits carry no attribution
        if: always()
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tools/conventions/check-pull-request.mjs

  # The single required check. A job absent from `needs` still reports its own
  # status on the pull request but cannot block a merge, so every new job
  # belongs here.
  #
  # `initialize` is listed although every other job already needs it: when it
  # fails the rest are `skipped`, not `failed`, and a gate that only looked for
  # failures would pass a run in which nothing ran. `skipped` is otherwise fine:
  # it is what `commits` reports on a push, and what a job with no affected
  # projects does.
  #
  # `main` requires this check by name, so a red gate blocks the merge rather
  # than merely showing. It also requires one approving review, which a lone
  # maintainer cannot give their own pull request — so a merge is
  # `gh pr merge --squash --admin`, and the override is recorded on the pull
  # request. The review requirement is kept deliberately: it is what makes the
  # bypass a decision rather than a habit.
  ci-gate:
    name: CI Gate
    needs:
      [initialize, lint, build, test, e2e, infra-preview, conventions, commits]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every required job succeeded or was skipped
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs failed or were cancelled."
            exit 1
          fi
